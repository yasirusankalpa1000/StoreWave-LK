<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="fav-wave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Base -->
  <rect width="100" height="100" rx="24" fill="#0B1329" />
  <!-- Bag Handle -->
  <path d="M38 32 C38 20, 62 20, 62 32" stroke="url(#fav-grad)" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Shopping Bag Modern Body -->
  <rect x="22" y="32" width="56" height="50" rx="12" fill="#0F172A" stroke="url(#fav-grad)" stroke-width="4" />
  <!-- Dynamic Waves -->
  <path d="M26 52 Q 38 43, 50 52 T 74 52" stroke="url(#fav-wave)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M26 64 Q 38 55, 50 64 T 74 64" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Sparkle Star -->
  <circle cx="68" cy="40" r="3.5" fill="#FBBF24" />
</svg>
